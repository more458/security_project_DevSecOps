# Configuracion de Checkov para el proyecto e-commerce DevSecOps

framework:
  - dockerfile
  - github_actions
  - secrets
  - terraform

skip-path:
  - system/
  - vendor/
  - node_modules/
  - writable/
  - tests/
  - .git/

skip-check:
  - CKV_AWS_130  # Subredes publicas DEBEN asignar IP publica: alojan el ALB. Cargas sensibles van en subredes privadas.
  - CKV_AWS_260  # ALB acepta 0.0.0.0/0 en puerto 80: intencional, es el punto de entrada publico.
  - CKV_AWS_382  # Egress abierto: comun en dev. Hardening futuro: restringir egress para prevenir exfiltracion.
  - CKV_AWS_118  # Enhanced monitoring: agrega costo, no aporta en dev. Se activaria en produccion.
  - CKV_AWS_161  # IAM database auth: dev usa password en Secrets Manager. Se evaluaria en produccion.
  - CKV_AWS_293  # Deletion protection off: intencional para permitir terraform destroy en dev.
  - CKV_AWS_136  # Cifrado KMS: el cifrado de ECR es inmutable y el emulador no soporta recrearlo. AES256 ya provee cifrado robusto.
  - CKV_AWS_338  # Retencion 1 anio: 30 dias alcanza para dev y controla costos.
  - CKV_AWS_336  # Readonly root FS: CodeIgniter necesita escribir en writable/. Se resolveria con volumenes especificos.
  - CKV_AWS_91   # Access logs: requieren bucket S3 dedicado. Hardening futuro.
  - CKV_AWS_150  # Deletion protection off: intencional para permitir terraform destroy en dev.
  - CKV_AWS_2    # ALB HTTPS: requiere certificado ACM + dominio real, no aplica en Floci/dev.
  - CKV_AWS_103  # TLS 1.2: idem, requiere HTTPS con certificado real.
  - CKV_AWS_378  # HTTP protocol: dev usa HTTP. En produccion listener HTTPS con redireccion.
  - CKV_AWS_157  # Multi-AZ: soportado via variable enable_high_availability. Desactivado en dev/Floci (no lo emula), se activa en produccion.
  - CKV2_AWS_20  # Redireccion HTTP a HTTPS: requiere listener HTTPS con certificado real.
  - CKV2_AWS_28  # WAF: servicio adicional pago, fuera del alcance del proyecto.
  - CKV2_AWS_64  # KMS key policy explicita: la policy default de AWS alcanza para dev.
  - CKV2_AWS_11  # VPC flow logs: requieren log group/bucket dedicado. Hardening futuro.
  - CKV2_AWS_57  # Rotacion automatica: requiere Lambda de rotacion. En dev la rotacion es manual.

compact: true
quiet: false